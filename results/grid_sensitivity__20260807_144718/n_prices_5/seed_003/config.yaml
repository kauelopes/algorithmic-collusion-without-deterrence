experiment_name: grid_sensitivity_n_prices_5
environment:
  type: bertrand
  demand:
    a: 2.0
    mu: 0.25
    a0: 0.0
  cost:
    c: 1.0
  market:
    n_firms: 2
    grid_extend: 1.0
  state:
    info_structure: rival_prices
agent:
  type: q_learning
  n_actions: 5
  memory_length: 2
  q_init: opponent_optimized
  alpha: 0.15
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay_steps: 1150000
  epsilon_decay_type: geometric
training:
  total_steps: 2000000
  eval_interval: 10000
  eval_window: 200000
  early_stop:
    enabled: false
  seed: 3
